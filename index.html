<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>随心写作</title>
    <script>
      // 首屏前确定主题与正文字体，避免闪烁。
      // 注意：偏好存于 ai-writer:prefs（JSON，内部键名沿用旧名），不是独立键。
      ;(function () {
        var t = 'system'
        var prefs = {}
        try {
          prefs = JSON.parse(localStorage.getItem('ai-writer:prefs') || '{}')
          t = prefs.theme || 'system'
        } catch (e) {}
        if (prefs.bodyFont) document.documentElement.setAttribute('data-font', prefs.bodyFont)
        var dark =
          t === 'dark' ||
          (t === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute(
          'data-theme',
          dark ? 'dark' : 'light'
        )
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
