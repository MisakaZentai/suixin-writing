<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Writer — 块级协作写作</title>
    <script>
      // 首屏前确定主题，避免深浅闪烁
      ;(function () {
        var t = localStorage.getItem('ai-writer:theme') || 'system'
        var dark =
          t === 'dark' ||
          (t === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute(
          'data-theme',
          dark ? 'dark' : 'light'
        )
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
